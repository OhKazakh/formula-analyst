name: Update data

on:
  schedule:
    # Saturday night for qualifying and the race prediction, the morning after a race weekend,
    # and midweek for late data and penalties.
    - cron: "0 23 * * 6"
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # A session OpenF1 hasn't published yet fails here and is picked up by the next run.
      - run: python -m src.sync --sessions
        continue-on-error: true
      - name: Commit new data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          message=$(git diff --cached --name-only --diff-filter=A -- data | python -m src.changes)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push
